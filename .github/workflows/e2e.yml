# E2E (Playwright) pe preview-ul Vercel — rulează automat după fiecare deploy de preview al lui `dev`.
#
# Cum funcționează: integrarea Vercel↔GitHub trimite `repository_dispatch` cu tipul
# `vercel.deployment.success`; payload-ul conține `url` (preview-ul) și `environment`.
# Producția e EXCLUSĂ explicit (if-ul din job-ul `gate`) — e2e-ul seedează date de test în DB și nu
# are ce căuta pe production. Preview-urile de PR sunt și ele excluse, dar din alt motiv (perechea
# preview↔bază de date) — vezi comentariul de la job-ul `gate`.
#
# ⚠️ repository_dispatch declanșează DOAR workflow-uri de pe branch-ul default (`main`) —
# devine activ abia după merge-ul acestui fișier în main. Până atunci se poate testa manual
# cu `workflow_dispatch` (Actions → E2E → Run workflow, cu URL-ul de preview).
#
# Secrete necesare (GitHub → Settings → Secrets and variables → Actions):
#   E2E_DATABASE_URL                — ramura Neon dev/preview (ACEEAȘI pe care o folosește preview-ul)
#   E2E_AUTH_SECRET                 — AUTH_SECRET-ul din scope-ul Preview (semnarea sesiunii seedate)
#   VERCEL_AUTOMATION_BYPASS_SECRET — Vercel → Deployment Protection → Protection Bypass for Automation
#   E2E_UPSTASH_REDIS_REST_URL      — opțional, scope Preview (Vercel → Env Vars) — fără el, setup-ul
#                                      sare peste reset-ul cotelor rate-limit (warning, nu eroare) și
#                                      userul de test poate epuiza real createDetail (10/h) la rulări
#                                      dese (bug găsit 2026-07-14, vezi CHANGELOG)
#   E2E_UPSTASH_REDIS_REST_TOKEN    — idem, tokenul asociat

name: E2E

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL-ul de preview pe care rulează testele (https://...vercel.app)'
        required: true
        type: string

# DB-ul de test e partajat — două rulări simultane și-ar strica reciproc seed-ul.
# Se rulează pe rând (coadă, fără anulare).
concurrency:
  group: e2e-shared-db
  cancel-in-progress: false

jobs:
  # Poartă preview↔DB. E2E are O SINGURĂ bază de test (`E2E_DATABASE_URL` = ramura Neon
  # `preview/dev`), dar integrarea Vercel↔Neon creează o bază PROPRIE, forkuită din producție,
  # pentru fiecare preview de PR. Rulat pe alt preview decât cel al lui `dev`, harnessul seedează
  # într-o bază iar aplicația citește din alta → suită roșie garantat, fără nicio legătură cu codul
  # (constatat 2026-07-27: pe preview-ul unui PR Dependabot, userul+detaliul seedate existau în
  # `preview/dev` și lipseau din baza preview-ului; au trecut doar testele care nu depind de
  # perechea app↔DB). Deci rulăm doar pentru deploy-urile lui `dev`.
  #
  # Comparăm SHA-ul deploy-ului cu vârful lui `dev` (semnal determinist, fără presupuneri despre
  # forma internă a `client_payload` — docs Vercel nu o specifică dincolo de `url`/`git.sha`).
  # Efect secundar dorit: un dispatch întârziat, al cărui SHA nu mai e vârful lui `dev`, se sare —
  # aceeași logică „doar cel mai recent" pe care o are deja `concurrency`.
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Deploy-ul e de pe `dev`?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          set -euo pipefail
          # Rularea manuală dă ținta explicit (`base_url`) → responsabilitatea perechii e a celui care o pornește.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dev_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)"
          if [ "$dev_sha" = "$DEPLOY_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy care nu e vârful lui \`dev\` (${DEPLOY_SHA:0:7}) — E2E sărit: baza de test e legată de ramura Neon \`preview/dev\`, iar acest preview are baza lui."
          fi

  e2e:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `issues: write` — necesar pt pasul „Alertare activă" (gh issue create/comment la eșec). Fără el,
    # GITHUB_TOKEN implicit e read-only pe issues → alertarea eșuează silențios cu „Resource not
    # accessible by integration" (găsit 2026-08-07, reprodus în CI).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (commit-ul deploy-ului)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.git.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ github.event.client_payload.url || inputs.base_url }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Raport Playwright (la eșec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Alertare ACTIVĂ (2026-08-07 — înainte, eșecul stătea pasiv în Actions, neobservat decât dacă
      # cineva se uita manual; exact ce s-a întâmplat cu eșecul care a scos la iveală bug-ul din
      # worksheet-2026-08-06.spec.ts). Un issue deschis pe repo, nu doar log — apare implicit în
      # notificările GitHub ale watcher-ilor. Reutilizează issue-ul deschis existent (label
      # `e2e-alerta`) în loc să creeze unul nou la fiecare rulare picată — evită spam pe flakiness
      # cunoscut (ex. rate-limit pe createDetail).
      - name: Alertare activă (issue GitHub) la eșec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.event.client_payload.url || inputs.base_url }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --label e2e-alerta --state open --json number --jq '.[0].number' || true)"
          body="Rulare picată: $RUN_URL"$'\n'"Preview testat: $DEPLOY_URL"$'\n\n'"Raport Playwright atașat ca artifact la rularea de mai sus (retenție 7 zile)."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "E2E picat pe preview (post-deploy dev)" --label e2e-alerta --body "$body"
          fi
