name: CI

# Verifica la fiecare push SI PR pe dev / main: secret scan (gitleaks) + npm audit (high/critical)
# + type-check + gardă subquery corelat (baseline, doar instanțe NOI) + lint + test (vitest) + build.
# Teste verzi nu inseamna build verde - vitest ignora erorile de tip; build-ul prinde ce pica la deploy.
# Testele = unit/domain/securitate (repo-uri mock, fara DB/secrete). E2E NU ruleaza in CI (cere preview + bypass).
# Pre-scaffold (fara package.json) ruleaza gol si trece - devine activ automat dupa Faza 0.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Istoric complet → secret scanning vede toate commit-urile, nu doar HEAD.
          fetch-depth: 0

      # Scanare de secrete pe tot istoricul + diff-ul PR-ului (SEC-10). Ar fi prins tokenul
      # de sesiune comis în e2e/.auth/. Licență cerută DOAR pe conturi de organizație; pe cont
      # personal rulează liber. Rulează indiferent de scaffold (fișierele există mereu).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detectează proiect scaffold-at
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: npm ci

      # Fail pe high/critical, CU EXCEPȚIA advisory-urilor din allowlist-ul documentat (risk-acceptance) —
      # vezi scripts/audit-check.mjs. Moderatele (postcss/esbuild) rămân sub prag ca înainte; orice high/
      # critical NOU, neacceptat, blochează PR-ul. (Înlocuiește `npm audit --audit-level=high` ca să putem
      # accepta țintit un high fără fix upstream — lodash-es via mermaid/Excalidraw, cod path neinvocat.)
      - name: Audit dependențe
        if: steps.detect.outputs.ready == 'true'
        run: node scripts/audit-check.mjs

      - name: Type-check
        if: steps.detect.outputs.ready == 'true'
        run: npm run typecheck --if-present

      # Gardă mecanică pt bug-ul recurent de subquery corelat necalificat (3x, ultima cu impact
      # real în producție — vezi CLAUDE.md §„Capcane tehnice"). Baseline îngheață instanțele
      # pre-existente; pică doar pe instanțe NOI. Vezi scripts/check-correlated-subqueries.mjs.
      - name: Subquery-uri corelate (gardă anti-recidivă)
        if: steps.detect.outputs.ready == 'true'
        run: npm run check:subqueries --if-present

      - name: Write-path Blob fără gardă de ownership (gardă anti-recidivă SEC-N01)
        if: steps.detect.outputs.ready == 'true'
        run: npm run check:blob-writes --if-present

      - name: Citire "details" fără gardă de vizibilitate proiect (gardă anti-recidivă)
        if: steps.detect.outputs.ready == 'true'
        run: npm run check:visibility --if-present

      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Test (vitest — unit/domain/securitate)
        if: steps.detect.outputs.ready == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: npm run build --if-present

      - name: Pre-scaffold (skip)
        if: steps.detect.outputs.ready == 'false'
        run: echo "Pre-scaffold - inca nu exista package.json. CI trece gol; devine activ dupa Faza 0."
