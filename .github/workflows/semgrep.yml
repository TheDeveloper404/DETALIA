name: Semgrep

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Rulare periodică independentă de push-uri, la fel ca CodeQL — prinde findere noi în reguli
    # publicate ulterior de Semgrep, nu doar în cod nou.
    - cron: "0 4 * * 1"

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Instalat pe runner (nu în container Docker) — `upload-sarif` de mai jos e o acțiune JS și are
      # nevoie de Node.js din runner-ul standard; un container `semgrep/semgrep` separat nu-l are.
      - name: Install Semgrep
        run: pip install semgrep

      # Reguli publice, gratuite (fără cont semgrep.dev / token) — securitate + secrete + OWASP +
      # stack-ul proiectului (TypeScript/React). `--sarif` + upload la GitHub Code Scanning ca să
      # apară exact ca findere-le CodeQL (tab Security + adnotări pe PR), nu ca un simplu log de job.
      #
      # `--severity ERROR --error` (2026-08-26, decizie Liviu): `semgrep scan` iese cu exit 0 by
      # default CHIAR DACĂ găsește ceva — fără `--error`, checkul verde nu dovedește nimic. Scopat pe
      # ERROR (nu WARNING/INFO): pachetele publice (owasp-top-ten/typescript/react) dau destul zgomot
      # stilistic pe severități mici — roșu trebuie să însemne „ceva serios", nu „un nag". `continue-on-error`
      # scos: acum vrem CHIAR să pice jobul pe findere reale, nu doar pe crash-ul tool-ului.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif

      # `if: always()` OBLIGATORIU acum: fără `continue-on-error` pe pasul de scan, un `--error` real
      # (findere ERROR) oprește jobul ÎNAINTE de acest pas — fără condiția asta, raportul SARIF nu s-ar
      # mai urca exact atunci când ai vrea să vezi findere-le (Security tab + adnotări pe PR).
      - uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
