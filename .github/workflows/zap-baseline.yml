name: ZAP baseline scan

# Verificare de securitate INDEPENDENTĂ (DAST), separată de auto-audit-urile Claude — vezi CLAUDE.md
# §„Verificare independentă". Scanează un URL live (preview stabil, NU production) pentru headere
# lipsă, cookie-uri nesigure, XSS reflectat, injecție HTTP genuină. NU rulează automat pe push/PR —
# trimite trafic real de scanare spre o aplicație live, pornește DOAR manual (workflow_dispatch) sau
# pe schedule, cu URL-ul dat explicit la trigger.
#
# ZAP baseline e pasiv (nu încearcă exploit-uri active) — sigur pentru un preview cu date reale de test,
# NU pentru production cu useri reali fără coordonare explicită.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL-ul de scanat (preview stabil, NU production fără coordonare explicită)"
        required: true
        type: string

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        env:
          # Preview-urile Vercel sunt în spatele Deployment Protection (SSO) — fără header-ul de bypass,
          # orice request neautentificat primește 302 spre vercel.com/sso-api, iar ZAP ajunge să scaneze
          # pagina de login a Vercel, nu aplicația (găsit 2026-08-22: findings false-pozitive despre
          # stripe.com/twitter.com/vercel.live — toate ale Vercel, nu ale noastre).
          ZAP_AUTH_HEADER: x-vercel-protection-bypass
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          target: ${{ inputs.target_url }}
          # Raport ca artifact GitHub Actions, nu comentariu automat pe PR (nu rulează pe PR).
          cmd_options: "-a"

      - name: Upload raport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-report
          path: report_html.html
          if-no-files-found: ignore
