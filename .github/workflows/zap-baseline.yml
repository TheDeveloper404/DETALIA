name: ZAP baseline scan

# Verificare de securitate INDEPENDENTĂ (DAST), separată de auto-audit-urile Claude — vezi CLAUDE.md
# §„Verificare independentă". Scanează un URL live (preview stabil, NU production) pentru headere
# lipsă, cookie-uri nesigure, XSS reflectat, injecție HTTP genuină. NU rulează automat pe push/PR —
# trimite trafic real de scanare spre o aplicație live, pornește DOAR manual (workflow_dispatch) sau
# pe schedule, cu URL-ul dat explicit la trigger.
#
# ZAP baseline e pasiv (nu încearcă exploit-uri active) — sigur pentru un preview cu date reale de test,
# NU pentru production cu useri reali fără coordonare explicită.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL-ul de scanat (preview stabil, NU production fără coordonare explicită)"
        required: true
        type: string

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          # Raport ca artifact GitHub Actions, nu comentariu automat pe PR (nu rulează pe PR).
          cmd_options: "-a"

      - name: Upload raport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
          if-no-files-found: ignore
