name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Rulare periodică independentă de push-uri — prinde vulnerabilități noi descoperite în
    # pattern-uri deja existente în cod, nu doar în cod nou.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          # Suita default = doar securitate + un set mic de calitate. `security-and-quality` adaugă
          # verificări de mentenabilitate (duplicare, complexitate) — fără integrare nouă, fără cost
          # de tokeni (decizie 2026-08-25, alternativă la SonarCloud la scara actuală a proiectului).
          queries: security-and-quality

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
