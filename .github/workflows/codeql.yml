name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Rulare periodică independentă de push-uri — prinde vulnerabilități noi descoperite în
    # pattern-uri deja existente în cod, nu doar în cod nou.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          # Suita default = doar securitate + un set mic de calitate. `security-and-quality` adaugă
          # verificări de mentenabilitate (duplicare, complexitate) — fără integrare nouă, fără cost
          # de tokeni (decizie 2026-08-25, alternativă la SonarCloud la scara actuală a proiectului).
          queries: security-and-quality

      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
