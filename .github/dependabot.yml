# SEC-A4 — Dependabot: PR-uri automate pentru dependențe vulnerabile/învechite (npm).
# Security updates le deschide imediat ce apare un advisory (nu respectă cooldown-ul).
# Version updates — lunar, grupate + cooldown 30 zile (o versiune nouă trebuie să fie "coaptă"
# minim 30 de zile pe npm înainte ca Dependabot s-o propună — evită versiuni proaspete/nestabile).
# Merge-ul rămâne manual (CI: type-check + lint + build).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 30
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      auth-js:
        # next-auth/@auth/core/@auth/drizzle-adapter trebuie bump-uite ÎMPREUNĂ — release-urile lor
        # sunt cuplate (versiuni exacte, nu range), altfel rămâne un pachet în urmă cu fix-ul de
        # securitate al altuia (găsit 2026-07-27: @auth/drizzle-adapter a rămas pe @auth/core vulnerabil
        # când next-auth a fost bump-uit singur).
        patterns:
          - "next-auth"
          - "@auth/*"
    ignore:
      # TS 7 (portul nativ) nu e suportat încă de typescript-eslint — un bump major pică CI-ul
      # (`typescript-eslint does not support TS 7.0`). Se scoate ignore-ul când ecosistemul prinde TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    cooldown:
      default-days: 30
    groups:
      codeql-action:
        # init/analyze/upload-sarif sunt pinned la ACELAȘI SHA în workflow-uri; bump-ul lor separat
        # lasă temporar versiuni nepotrivite în același job → CodeQL „Not all workflow steps ... use
        # the same version" (roșu). Grupate = un singur PR atomic (găsit 2026-09-01, PR #277).
        patterns:
          - "github/codeql-action*"
